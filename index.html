 устройства для зарядки электрокаров. </p>\n<h3>Отделка квартир</h3>\n<p>Приобрести квартиру в ЖК «Звезда Столицы 2» можно в 3-х вариантах отделки:</p>\n<ul>\n<li>черновая;</li>\n<li>whitebox;</li>\n<li>ремонт «под ключ».</li>\n</ul>\n", "developer": "ДОННЕФТЕСТРОЙ", "finishing_groups": [{"name": "Ремонт «под ключ»", "type": "turn_key"}, {"name": "White Box", "type": "pre_fine"}, {"name": "Без отделки", "type": "without"}], "images": ["https://img.gid.house/rs:fill:1400:0:0/plain/production/a3399159143ff55dc286dd405fc4f37f23af9.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/c3c48dd409b487c02d0743368255420c90192.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/f5fe87eb078a0e67776fb8ec81ceb3ea7b220.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/f423d810959220a41c6596fe277cbd06f15aa.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/3b41bbe58b6b2efd8b5172a80a4dcd0021c84.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/b9d1ad597b468cc9886f028030e340429f85e.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/e894edc8f192b99c5ed940fdeb38152da5f6d.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/ac1d45337c6877fe948f17b8f6e669b12719d.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/046cfeb7fa51fc24daf19df2e9173f6a15390.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/1140779a884f9d5befd458f4e01e6b26d0074.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/09be58c4d3104a5a0a93e102140d0e593b1ec.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/3dfb2d26bfaa57d3c71984f647932c09fdf9a.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/8fd73f8b0f9c4c693827ffb0efd1f336d778f.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/015870ce69fd4bacd915a62f986e136adb1af.jpg", "https://img.gid.house/rs:fill:1400:0:0/plain/production/a4d89e09906a4dbca1fe8e8b2bb4dd1834f06.jpg"], "thumbs": ["https://img.gid.house/rs:fill:300   const wa = 'https://wa.me/79281022795?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%21%20%D0%98%D0%BD%D1%82%D0%B5%D1%80%D0%B5%D1%81%D1%83%D0%B5%D1%82%20%D0%96%D0%9A%20%D0%97%D0%B2%D0%B5%D0%B7%D0%B4%D0%B0%20%D0%A1%D1%82%D0%BE%D0%BB%D0%B8%D1%86%D1%8B%C2%A02%2C%20%D0%A0%D0%BE%D1%81%D1%82%D0%BE%D0%B2-%D0%BD%D0%B0-%D0%94%D0%BE%D0%BD%D1%83%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9D%D0%B0%D0%BD%D1%81%D0%B5%D0%BD%D0%B0.%20%D0%9F%D0%BE%D0%B4%D1%81%D0%BA%D0%B0%D0%B6%D0%B8%D1%82%D0%B5%20%D0%BF%D0%BE%20%D0%BD%D0%B0%D0%BB%D0%B8%D1%87%D0%B8%D1%8E%20%D0%B8%20%D1%86%D0%B5%D0%BD%D0%B5.';

  // галерея
  let cur = 0;
  const imgs = DATA.images;
  const thumbs = DATA.thumbs;
  const main = document.getElementById('mainImg');
  const galNav = document.getElementById('galNav');
  const tbox = document.getElementById('thumbs');
  function show(i) {
    cur = (i + imgs.length) % imgs.length;
    main.src = imgs[cur];
    galNav.textContent = `${cur + 1} / ${imgs.length}`;
    document.querySelectorAll('.thumbs img').forEach((t, k) => t.classList.toggle('active', k === cur));
  }
  thumbs.forEach((url, i) => {
    const im = document.createElement('img');
    im.src = url; im.onclick = () => show(i);
    tbox.appendChild(im);
  });
  document.getElementById('prevBtn').onclick = () => show(cur - 1);
  document.getElementById('nextBtn').onclick = () => show(cur + 1);
  show(0);

  // промо-бейджи
  const promosBox = document.getElementById('promosBox');
  (DATA.promos || []).slice(0, 3).forEach((p, i) => {
    const b = document.createElement('span');
    b.className = 'promo-badge' + (i > 0 ? ' alt' : '');
    b.textContent = p.name.trim();
    promosBox.appendChild(b);
  });

  // info-блок
  const info = document.getElementById('info');
  const chars = DATA.characteristics;
  const flatsRows = DATA.flats.map(f => `
    <span class="room">${f.rooms}</span>
    <span class="area">${f.area || ''}</span>
    <span class="price">${f.price.replace(/\u00a0/g,' ')}</span>
  `).join('');

  const charsRows = [
    ['Класс жилья', chars['class']],
    ['Сдача', chars.settlement],
    ['Домов в жк', chars.buildings],
    ['Этажность', chars.floors],
    ['Метражи', chars.areas],
    ['Высота потолков', chars.ceiling],
    ['Материал стен', chars.material],
    ['Парковка', chars.parking],
  ].filter(r => r[1]).map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join('');

  const about = (DATA.about || '').replace(/\u00a0/g, ' ').slice(0, 350);
  const aboutFull = (DATA.about || '').replace(/\u00a0/g, ' ');

  info.innerHTML = `
    <div class="info-type">Жилой комплекс</div>
    <h2 class="info-name">${name}</h2>
    <div class="info-addr">${addr}</div>
    <div class="info-price-row">
      <span class="info-price-range">${(DATA.price_range || '').replace(/\u00a0/g, ' ')}</span>
    </div>
    <div class="info-mortgage">${(DATA.mortgage_from || '').replace(/\u00a0/g, ' ')}</div>
    <div class="info-table">${flatsRows}</div>
    <div class="chars-grid">${charsRows}</div>
    <div class="about" id="aboutBox">${about}${aboutFull.length > about.length ? '... <span class="about-toggle" id="aboutToggle">читать дальше</span>' : ''}</div>
    ${DATA.developer ? `<div class="developer">${DATA.developer}</div>` : ''}
    <div class="actions">
      <a class="btn btn-tel" href="tel:+${phone}">${telDisplay}</a>
      <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">Позвоните мне</a>
    </div>
  `;

  // expand about
  const tg = document.getElementById('aboutToggle');
  if (tg) tg.onclick = () => document.getElementById('aboutBox').innerHTML = aboutFull;

  // close button — для демо просто прячет popup
  document.querySelector('.popup-close').onclick = () => {
    document.getElementById('overlay').style.display = 'none';
  };
})();
</script>

</body></html>
