<style>
* {box-sizing: border-box}
body {margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f1f3;color:#1a1a1a}
.bg-cards {padding:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1400px;margin:0 auto;filter:blur(2px) brightness(0.85);pointer-events:none}

.overlay {position:fixed;inset:0;background:rgba(15,20,30,0.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}

.actions {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:14px}

ний стиль фасадов разработан архитектурным бюро GASP®. В концепции бежево-коричневых фасадов заложена тема постоянного движения и стремления к всестороннему развитию. Дополняет изысканную архитектуру стильная ночная подсветка домов. Также на фасадах установлены корзины под внешние блоки кондиционеров.<\/p>\n<p>ЖК «Звезда Столицы 2» - дома с высочайшим классом энергоэффективности А++, что позволит жильцам сократить расходы на оплату коммунальных услуг. <\/p>\n<h3>Расположение ЖК «Звезда Столицы 2»<\/h3>\n<p>ЖК «Звезда Столицы 2» расположен в центральной части Ростова-на-Дону на пересечении улиц Нансена и Шеболдаева. В пешей доступности:<\/p>\n<ul>\n<li>Детский садик «Мамино солнышко».<\/li>\n<li>Лицей №69, школа №32, 2 частные школы.<\/li>\n<li>Ростовский государственный университет путей сообщения, Промышленно-технический колледж, Академия психологии и педагогики.<\/li>\n<li>Поликлиника РГУПС, городская поликлиника №12.<\/li>\n<li>Стадион «Труд», фитнес-клуб, сетевые супермаркеты, автосервис, стоматология, кафе, зоомагазин.<\/li>\n<\/ul>\n<p>За 7 минут можно доехать до 2 ТЦ - «РИО» и «Горизонт», выставочного центра «ДонЭкспоцентр». В пределах 5-ти минут езды расположен Комсомольский сквер и Студенческий парк ДГТУ, где можно приятно провести время. Доехать до Главного авто и Ж/Д вокзала можно в среднем за 10 минут. <\/p>\n<p>Вокруг ЖК расположено несколько остановок общественного транспорта. Уехать в город можно как со стороны ул. Нансена/проспект Буденновский (маршруты № 61, 453, 456), так и с ул. Шеболдаева, где курсирует более 20 маршрутов. <\/p>\n<h3>Социальная и внутренняя инфраструктура<\/h3>\n<p>Ухоженный двор жилого комплекса включает наличие зеленых газонов и кустарников. На закрытой территории предусмотрены детские и спортивные площадки с травмобезопасным покрытием, зоны отдыха для взрослого населения. По всему периметру организовано круглосуточное видеонаблюдение, а вход осуществляется через систему «умный дом». <\/p>\n<p>Для автовладельцев предусмотрен по <script>
(function(){
  try {
    var CFG = JSON.parse(document.getElementById('popup-config').textContent);
    var DATA = CFG.data;
    var PLANS = CFG.plans;
    var WA_PHONE = CFG.wa_phone;
    var TEL_DISPLAY = CFG.tel_display;
    var WA_LINK = CFG.wa_link;
    var TG_LINK = CFG.tg_link;

    function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}

    var rawName = DATA.name && DATA.name.name ? DATA.name.name : DATA.name;
    var name = String(rawName);
    var addr = String(DATA.address || '');

    var imgs = DATA.images || [];
    var thumbs = DATA.thumbs || [];
    var cur = 0;
    var main = document.getElementById('mainImg');
    var galNav = document.getElementById('galNav');
    var tbox = document.getElementById('thumbs');

    function show(i){
      if (!imgs.length) return;
      cur = (i + imgs.length) % imgs.length;
      main.src = imgs[cur];
      galNav.textContent = (cur + 1) + ' / ' + imgs.length;
      var ts = tbox.querySelectorAll('img');
      for (var k = 0; k < ts.length; k++) {
        if (k === cur) ts[k].classList.add('active'); else ts[k].classList.remove('active');
      }
    }
    for (var i = 0; i < thumbs.length; i++) {
      var im = document.createElement('img');
      im.src = thumbs[i];
      (function(idx){ im.onclick = function(){ show(idx); }; })(i);
      tbox.appendChild(im);
    }
    document.getElementById('prevBtn').onclick = function(){ show(cur - 1); };
    document.getElementById('nextBtn').onclick = function(){ show(cur + 1); };
    if (imgs.length) show(0);

    var promosBox = document.getElementById('promosBox');
    var promos = (DATA.promos || []).slice(0, 3);
    for (var p = 0; p < promos.length; p++) {
      var b = document.createElement('span');
      b.className = 'promo-badge' + (p > 0 ? ' alt' : '');
      b.textContent = String(promos[p].name).trim();
      promosBox.appendChild(b);
    }

    var info = document.getElementById('info');
    var chars = DATA.characteristics || {};
    var flats = DATA.flats || [];
    var priceRange = String(DATA.price_range || '');
    var mortgage = String(DATA.mortgage_from || '');

    var flatsHtml = '';
    for (var f = 0; f < flats.length; f++) {
      var fl = flats[f];
      flatsHtml += '<span class="room">' + esc(fl.rooms) + '</span>';
      flatsHtml += '<span class="area">' + esc(fl.area || '') + '</span>';
      flatsHtml += '<span class="price">' + esc(String(fl.price)) + '</span>';
    }

    var charRows = [
      ['Класс жилья', chars['class']],
      ['Сдача', chars.settlement],
      ['Домов в жк', chars.buildings],
      ['Этажность', chars.floors],
      ['Метражи', chars.areas],
      ['Высота потолков', chars.ceiling],
      ['Материал стен', chars.material],
      ['Парковка', chars.parking]
    ];
    var charsHtml = '';
    for (var c = 0; c < charRows.length; c++) {
      if (charRows[c][1]) {
        charsHtml += '<div><b>' + esc(charRows[c][0]) + '</b><span>' + esc(charRows[c][1]) + '</span></div>';
      }
    }

    var plansHtml = '';
    for (var pp = 0; pp < PLANS.length; pp++) {
      var pl = PLANS[pp];
      plansHtml += '<div class="plan-cell">';
      plansHtml += '<img src="' + esc(pl.plan) + '" alt="' + esc(pl.rooms) + '">';
      plansHtml += '<div class="plan-rooms">' + esc(pl.rooms) + '</div>';
      plansHtml += '<div class="plan-area">' + esc(pl.area) + '</div>';
      plansHtml += '</div>';
    }

    var aboutFull = String(DATA.about || '');
    var aboutShort = aboutFull.slice(0, 220);

    var html = '';
    html += '<div class="info-type">Жилой комплекс</div>';
    html += '<h2 class="info-name">' + esc(name) + '</h2>';
    html += '<div class="info-addr">' + esc(addr) + '</div>';
    if (priceRange) html += '<div class="info-price-row"><span class="info-price-range">' + esc(priceRange) + '</span></div>';
    if (mortgage) html += '<div class="info-mortgage">' + esc(mortgage) + '</div>';
    if (flatsHtml) html += '<div class="info-table">' + flatsHtml + '</div>';
    if (charsHtml) html += '<div class="chars-grid">' + charsHtml + '</div>';
    if (plansHtml) {
      html += '<div class="section-label">Типовые планировки</div>';
      html += '<div class="plans">' + plansHtml + '</div>';
    }
    if (aboutShort) {
      html += '<div class="about" id="aboutBox">' + esc(aboutShort);
      if (aboutFull.length > aboutShort.length) html += '... <span class="about-toggle" id="aboutToggle">читать дальше</span>';
      html += '</div>';
    }
    if (DATA.developer) html += '<div class="developer">' + esc(DATA.developer) + '</div>';
    html += '<div class="actions">';
    html += '<a class="btn btn-tel" href="tel:+' + WA_PHONE + '">' + TEL_DISPLAY + '</a>';
    html += '<a class="btn btn-wa" href="' + WA_LINK + '" target="_blank" rel="noopener">WhatsApp</a>';
    html += '<a class="btn btn-tg" href="' + TG_LINK + '" target="_blank" rel="noopener">Telegram</a>';
    html += '</div>';

    info.innerHTML = html;

    var tg = document.getElementById('aboutToggle');
    if (tg) tg.onclick = function(){
      var box = document.getElementById('aboutBox');
      box.classList.add('expanded');
      box.innerHTML = esc(aboutFull);
    };

    document.querySelector('.popup-close').onclick = function(){
      document.getElementById('overlay').style.display = 'none';
    };
  } catch (e) {
    var info = document.getElementById('info');
    if (info) info.innerHTML = '<div style="padding:20px;color:#d32"><b>JS error:</b><br>' + String(e.message || e) + '</div>';
  }
})();
</script>
